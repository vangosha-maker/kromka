<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>КРОМКА</title>
<style>
:root {
  --ink: #12141c;
  --ink-2: #1a1e2a;
  --panel: #1c2230;
  --panel-2: #262c3d;
  --line: rgba(232, 214, 186, 0.16);
  --copper: #e2a15a;
  --copper-2: #ffd7a4;
  --bone: #f4efe6;
  --muted: #b7b1a6;
  --teal: #7ed0c4;
  --teal-dim: #1c4e52;
  --chasm: #0c2a30;
  --enemy: #ff5d6e;
  --violet: #c97bff;
  --good: #9dffc8;
  --danger: #ff6a45;
  --ground: #2a3142;
  --ground-2: #323a4e;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
  --sans: "Segoe UI", "Liberation Sans", "DejaVu Sans", sans-serif;
  --serif: Georgia, "Liberation Serif", "Times New Roman", serif;
  --tile: 64px;
  --gap: 4px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  min-height: 100%;
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(226, 161, 90, 0.16), transparent 55%),
    radial-gradient(900px 500px at -10% 110%, rgba(30, 90, 96, 0.35), transparent 50%),
    var(--ink);
  color: var(--bone);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
}
button, input { font-family: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 14px;
  font-size: 15px;
}
button:hover { border-color: rgba(226, 161, 90, 0.55); }
button:focus-visible, .tile:focus-visible, .mech:focus-visible {
  outline: 2px solid var(--copper-2);
  outline-offset: 2px;
}
button:disabled { opacity: 0.45; cursor: default; }
button.primary {
  background: linear-gradient(180deg, #f0c48a, #c9843a);
  color: #2a1608;
  border-color: transparent;
  font-weight: 700;
}
button.ghost { background: transparent; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: 0.01em; margin: 0; }
p { margin: 0; }

#app { min-height: 100%; }

.screen {
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px 20px 48px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
  gap: 36px;
  align-items: center;
  min-height: calc(100vh - 80px);
}
.brand {
  font-family: var(--serif);
  font-size: clamp(64px, 10vw, 112px);
  line-height: 0.85;
  letter-spacing: 0.04em;
  margin: 0 0 12px;
}
.brand span { color: var(--copper); }
.tagline { font-size: 20px; max-width: 36ch; color: var(--bone); }
.lede { color: var(--muted); max-width: 46ch; margin-top: 12px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.hero-art {
  background: var(--panel);
  border-radius: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  overflow: hidden;
}
.hero-art svg { display: block; width: 100%; height: auto; }
.fineprint { margin-top: 18px; color: var(--muted); font-size: 14px; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.top h1 { font-size: 34px; }
.linkish { background: none; border: none; color: var(--copper-2); padding: 8px 0; min-height: 44px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card {
  text-align: left;
  background: var(--panel);
  border-radius: 18px;
  padding: 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100%;
}
.card h2 { font-size: 28px; }
.rating {
  display: inline-flex;
  align-self: flex-start;
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #2a1608;
  background: var(--copper);
}
.rating.mid { background: var(--teal); }
.rating.hard { background: var(--enemy); color: #2a0c12; }
.blurb { color: var(--muted); font-size: 14px; min-height: 3.2em; }
.record { font-size: 14px; color: var(--copper-2); }
.mini {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 2px;
  width: 100%;
  aspect-ratio: 1;
  margin-top: 4px;
}
.mini i { display: block; border-radius: 2px; background: #2c3344; }
.mini .m-w { background: #12383f; }
.mini .m-n { background: #7d8da1; }
.mini .m-b { background: #e0a04a; }
.mini .m-r { background: #ffe08a; }
.mini .m-s { background: #6a3d86; }
.mini .m-p { background: var(--copper-2); box-shadow: 0 0 0 1px #2a1608 inset; }
.mini .m-e { background: var(--enemy); }

.battle {
  max-width: 1180px;
  margin: 0 auto;
  padding: 12px 12px 28px;
  display: grid;
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
  grid-template-areas:
    "top top"
    "dock stage";
  gap: 12px 16px;
}
.battle-top { grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.battle-top .name {
  font-family: var(--serif);
  font-size: 28px;
  margin-right: auto;
}
.turn-pill, .sound {
  border-radius: 999px;
  padding: 6px 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  min-height: 40px;
}
.gridbar { display: flex; align-items: center; gap: 8px; min-width: 180px; }
.gridbar b { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pips { display: flex; gap: 3px; flex-wrap: wrap; }
.pips i {
  width: 14px;
  height: 18px;
  border-radius: 3px;
  background: #3a2a1c;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}
.pips i.on {
  background: linear-gradient(180deg, #ffe3a8, #e09a3a);
  box-shadow: 0 0 8px rgba(226, 161, 90, 0.55);
}
.pips i.pop { animation: pip 420ms ease; }
.stage { grid-area: stage; display: flex; justify-content: flex-start; align-items: flex-start; }
.frame {
  padding: 10px;
  border-radius: 20px;
  background:
    linear-gradient(180deg, rgba(226,161,90,.28), rgba(226,161,90,0) 28%),
    #141924;
  box-shadow: var(--shadow), inset 0 0 0 1px rgba(226,161,90,.32);
}
.board { position: relative; width: max-content; touch-action: manipulation; }
.board.shake { animation: shake 220ms linear; }
.tiles {
  display: grid;
  grid-template-columns: repeat(8, var(--tile));
  grid-auto-rows: var(--tile);
  gap: var(--gap);
  position: relative;
  z-index: 1;
}
.tile {
  width: var(--tile);
  height: var(--tile);
  border-radius: 8px;
  position: relative;
  background: var(--ground);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
  padding: 0;
  min-height: 0;
  overflow: hidden;
}
.tile.alt { background: var(--ground-2); }
.tile.water {
  background:
    radial-gradient(circle at 50% 58%, #04161a 0 22%, #0c3a42 58%, #186872 100%);
  box-shadow: inset 0 0 0 2px #3ec8c0, inset 0 0 18px rgba(0, 0, 0, 0.65);
}
.tile.water::after {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  top: 28%;
  height: 22%;
  border-radius: 50%;
  border: 1px solid rgba(160, 230, 220, 0.45);
  animation: ripple 3s ease-in-out infinite;
}
.tile.mountain { background: linear-gradient(160deg, #9aabbe, #556274 55%, #3c4654); }
.tile.building { background: #3a2c22; }
.tile.rubble-building { background: #2a2422; }
.tile.rubble-mountain { background: #3d4450; }
.tile.spawn { box-shadow: inset 0 0 0 2px rgba(180, 90, 220, 0.7); }
.tile .deco { position: absolute; inset: 0; pointer-events: none; }
.tile.move {
  background-color: rgba(58, 126, 230, 0.55);
  box-shadow: inset 0 0 0 3px #7eb6ff;
}
.tile.weapon {
  background-color: rgba(240, 176, 48, 0.42);
  box-shadow: inset 0 0 0 3px #ffc14d;
}
.tile.coach { box-shadow: inset 0 0 0 3px #fff1d2, 0 0 0 2px rgba(226,161,90,.35); }
.tile.tele { background-image: linear-gradient(0deg, rgba(255, 120, 60, 0.38), rgba(255, 120, 60, 0.38)); }
.tile.impact { background-image: linear-gradient(0deg, rgba(230, 50, 50, 0.62), rgba(230, 50, 50, 0.62)); }
.ord-tile {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  min-width: 22px;
  height: 22px;
  padding: 0 4px;
  border-radius: 99px;
  background: #fff;
  color: #8d140c;
  font-size: 14px;
  font-weight: 800;
  line-height: 22px;
  text-align: center;
  pointer-events: none;
  box-shadow: 0 0 0 2px #e23d3d;
}
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; width: 100%; font-size: 13px; color: var(--muted); }
.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  margin-right: 4px;
  vertical-align: -2px;
}
.swatch.red { background: #e23d3d; }
.swatch.blue { background: #3a7ee6; }
.swatch.gold { background: #ffc14d; }
.swatch.push { background: #ffc14d; clip-path: polygon(0 40%, 70% 40%, 70% 10%, 100% 50%, 70% 90%, 70% 60%, 0 60%); }
.swatch.pull { background: #3ec8c0; clip-path: polygon(100% 40%, 30% 40%, 30% 10%, 0 50%, 30% 90%, 30% 60%, 100% 60%); }
.piece { box-shadow: inset 0 0 0 2px var(--accent, transparent); }
.atk-icon {
  position: absolute;
  right: 1px;
  bottom: 7px;
  width: 14px;
  height: 14px;
  color: var(--accent, #fff);
  background: rgba(8, 10, 16, 0.72);
  border-radius: 4px;
  z-index: 2;
}
.atk-icon svg { width: 14px; height: 14px; display: block; }
.mini-svg { position: relative; }
.mini-svg .atk-icon { right: -2px; bottom: -2px; }
.mech { border-color: var(--accent, var(--line)); }
.unitcard {
  background: #1c2230;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
}
.uc-top { display: flex; gap: 8px; align-items: center; position: relative; }
.uc-top svg { width: 52px; height: 52px; flex: none; }
.uc-top .atk-icon { position: static; width: 22px; height: 22px; }
.uc-top .atk-icon svg { width: 22px; height: 22px; }
.uc-top b { font-size: 18px; }
.uc-pips { display: flex; gap: 4px; margin: 6px 0; }
.uc-pips i { width: 16px; height: 8px; border-radius: 3px; background: #3a2a1c; }
.uc-pips i.on { background: var(--accent, #ffc14d); }
.uc-now { margin: 6px 0 0; font-size: 14px; }
.minigrid {
  display: grid;
  grid-template-columns: repeat(var(--n), 22px);
  gap: 3px;
  margin-top: 6px;
}
.minigrid i {
  position: relative;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: #2a3142;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: #2a0c12;
}
.minigrid i.self { background: var(--accent, #e2a15a); }
.minigrid i.dmg { background: #e23d3d; }
.minigrid i.push { background: #ffc14d; }
.minigrid i.pull { background: #3ec8c0; }
.minigrid i.ray { background: #6a3d86; }
.minigrid i[data-arrow]::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-bottom: 7px solid #1a120c;
}
.minigrid i[data-arrow="N"]::after { transform: translateY(-8px); animation: nudgeN 1.1s ease-in-out infinite; }
.minigrid i[data-arrow="S"]::after { transform: translateY(8px) rotate(180deg); animation: nudgeS 1.1s ease-in-out infinite; }
.minigrid i[data-arrow="E"]::after { transform: translateX(8px) rotate(90deg); animation: nudgeE 1.1s ease-in-out infinite; }
.minigrid i[data-arrow="W"]::after { transform: translateX(-8px) rotate(-90deg); animation: nudgeW 1.1s ease-in-out infinite; }
@keyframes nudgeN { 50% { transform: translateY(-12px); } }
@keyframes nudgeS { 50% { transform: translateY(12px) rotate(180deg); } }
@keyframes nudgeE { 50% { transform: translateX(12px) rotate(90deg); } }
@keyframes nudgeW { 50% { transform: translateX(-12px) rotate(-90deg); } }
.diagram-note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.compare-card {
  border: 1px solid var(--accent, var(--line));
  border-radius: 12px;
  padding: 8px;
  background: #171c28;
}
.compare-top { display: flex; align-items: flex-end; gap: 4px; }
.compare-top .atk-icon { position: static; }
.nowbar {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
  flex-basis: 100%;
  background: #2a2218;
  border: 1px solid rgba(226, 161, 90, 0.55);
  border-radius: 12px;
  padding: 8px 10px;
}
.nowbar p { flex: 1; margin: 0; font-size: 16px; }
.nowbar button { min-height: 40px; }
.nowbar.nope { animation: nope 0.35s linear; }
#tut-arrow {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  font-size: 26px;
  line-height: 1;
  filter: drop-shadow(0 2px 0 #000);
}
body.teaching .tile,
body.teaching .mech,
body.teaching .endturn,
body.teaching #confirm,
body.teaching .piece {
  opacity: 0.38;
}
body.teaching .tut-hot,
body.teaching .tile.move,
body.teaching .tile.impact,
body.teaching .tile.tele,
body.teaching #confirm.tut-hot,
body.teaching #next-hint.tut-hot,
body.teaching .gridbar.tut-hot {
  opacity: 1;
}
body.teaching .tut-hot {
  animation: tutpulse 1s ease-in-out infinite;
  z-index: 6;
}
.rules-row { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.rules-row svg { width: 56px; height: 56px; flex: none; }
.rules-diagram { width: 100%; height: auto; margin: 8px 0; }
@keyframes tutpulse {
  50% { box-shadow: 0 0 0 4px #fff4c8, 0 0 16px rgba(255, 196, 80, 0.9); }
}
@keyframes nope {
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
.tile.cursor { box-shadow: inset 0 0 0 2px #fff; }
.tile.hitflash { animation: flash 280ms ease; }
.pieces, .fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.fx { z-index: 4; }
.piece {
  position: absolute;
  width: var(--tile);
  height: var(--tile);
  left: 0;
  top: 0;
  filter: drop-shadow(0 6px 4px rgba(0,0,0,.35));
}
.piece .rot { width: 100%; height: 100%; transform-origin: 50% 58%; }
.piece.selected { filter: drop-shadow(0 0 6px rgba(255, 215, 164, 0.9)); }
.piece .badge {
  position: absolute;
  top: 1px;
  right: 1px;
  min-width: 16px;
  height: 16px;
  border-radius: 99px;
  background: #2a0c12;
  color: white;
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 1px var(--enemy);
}
.piece .hp {
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 2px;
  display: flex;
  gap: 2px;
  justify-content: center;
}
.piece .hp i {
  width: 7px;
  height: 4px;
  border-radius: 2px;
  background: rgba(0,0,0,.45);
}
.piece.player .hp i.on { background: var(--copper-2); }
.piece.enemy .hp i.on { background: #ffd0d4; }
.tag {
  position: absolute;
  left: 3px;
  top: 2px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #1a120c;
  background: rgba(255,255,255,.78);
  border-radius: 4px;
  padding: 0 3px;
  line-height: 14px;
}
.piece.enemy .tag { color: white; background: rgba(40, 8, 16, 0.72); }

.arrow { fill: none; stroke: var(--enemy); stroke-width: 3; stroke-linecap: round; }
.arrow.push { stroke: var(--copper-2); stroke-width: 3; }
.mark {
  position: absolute;
  transform: translate(-50%, -50%);
  font-weight: 800;
  font-size: 15px;
  color: white;
  text-shadow: 0 1px 2px #000;
  pointer-events: none;
}
.mark.skull { font-size: 18px; }
.floater {
  position: absolute;
  z-index: 6;
  transform: translate(-50%, -40%);
  font-weight: 800;
  color: #ffe1dc;
  text-shadow: 0 2px 0 #4a1010;
  animation: float 700ms ease forwards;
  font-size: 18px;
}
.shell, .hook, .beam {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}
.shell {
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff, #ffb15a 40%, #c4512a);
  box-shadow: 0 0 10px #ffb15a;
}
.impact {
  position: absolute;
  width: 36px;
  height: 36px;
  margin: -18px 0 0 -18px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,120,60,.0) 70%);
  animation: pop 280ms ease forwards;
}
.dock {
  grid-area: dock;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.mechs { display: flex; flex-direction: column; gap: 8px; }
.mech {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 8px;
  align-items: center;
  text-align: left;
  background: var(--panel);
  border-radius: 14px;
  padding: 8px;
}
.mech.on { border-color: var(--copper); box-shadow: inset 0 0 0 1px var(--copper); }
.mech .who { font-weight: 700; }
.mech .sub { color: var(--muted); font-size: 13px; }
.mech .mini-svg { width: 42px; height: 42px; }
.modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.modes button { min-height: 40px; padding: 6px; font-size: 14px; }
.modes button.on { background: #3a2a1c; border-color: var(--copper); color: var(--copper-2); }
.forecast, .hint, .last {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  font-size: 14px;
}
.forecast strong { color: var(--good); }
.forecast.bad strong { color: var(--danger); }
.forecast ul, .last ul { margin: 6px 0 0; padding-left: 18px; }
.hint { border-color: rgba(226,161,90,.45); background: #2a2218; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .endturn { grid-column: 1 / -1; }
.endturn.ready { box-shadow: 0 0 0 2px var(--copper); }
.keys { color: var(--muted); font-size: 12px; line-height: 1.35; }
.threats { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.threats div { display: flex; gap: 8px; align-items: baseline; }
.ord {
  width: 18px; height: 18px; border-radius: 99px;
  display: inline-grid; place-items: center;
  background: #3a1218; color: white; font-size: 12px; font-weight: 700;
}

.banner {
  position: absolute;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  background: rgba(18, 16, 20, 0.88);
  border: 1px solid var(--copper);
  color: var(--copper-2);
  border-radius: 999px;
  padding: 6px 12px;
  z-index: 6;
  font-size: 14px;
  pointer-events: none;
  white-space: nowrap;
}

.end {
  position: fixed;
  inset: 0;
  background: rgba(8, 9, 12, 0.62);
  display: grid;
  place-items: center;
  padding: 18px;
  z-index: 20;
}
.end[hidden] { display: none; }
.end-card {
  width: min(440px, calc(100vw - 24px));
  max-width: calc(100vw - 24px);
  background: #1b2130;
  border-radius: 20px;
  padding: 22px;
  border: 1px solid rgba(226,161,90,.4);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.end-card h2 { font-size: 40px; margin-bottom: 4px; }
.end-card .sub { color: var(--muted); margin-bottom: 14px; overflow-wrap: anywhere; }
.score-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.score-row span:last-child { white-space: nowrap; }
.score-row.total { font-size: 20px; font-family: var(--serif); }
.end-actions { display: flex; gap: 8px; margin-top: 16px; }
.end-actions button { flex: 1; }
.sparks { height: 8px; margin-bottom: 8px; }
.win h2 { color: var(--copper-2); }
.lose h2 { color: var(--enemy); }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(8,9,12,.72);
  display: grid;
  place-items: center;
  z-index: 30;
  padding: 16px;
}
.modal[hidden] { display: none; }
.sheet {
  width: min(560px, 100%);
  max-height: min(86vh, 760px);
  overflow: auto;
  background: #1b2130;
  border-radius: 18px;
  padding: 18px 18px 22px;
  border: 1px solid var(--line);
}
.sheet h2 { font-size: 28px; margin-bottom: 8px; }
.sheet h3 { font-size: 18px; margin: 14px 0 4px; }
.sheet p, .sheet li { color: var(--bone); font-size: 15px; }
.sheet ul { margin: 0; padding-left: 18px; }

@keyframes ripple {
  0%, 100% { transform: translateY(0); opacity: .45; }
  50% { transform: translateY(3px); opacity: .9; }
}
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(calc(var(--shake, 4px) * -1), 1px); }
  40% { transform: translate(var(--shake, 4px), -1px); }
  60% { transform: translate(calc(var(--shake, 4px) * -0.5), 0); }
  80% { transform: translate(calc(var(--shake, 4px) * 0.4), 1px); }
}
@keyframes float {
  to { transform: translate(-50%, -140%); opacity: 0; }
}
@keyframes pop {
  from { transform: scale(0.4); opacity: 1; }
  to { transform: scale(1.6); opacity: 0; }
}
@keyframes flash {
  0% { filter: brightness(2.2); }
  100% { filter: none; }
}
@keyframes pip {
  0% { transform: translateY(-4px); background: var(--danger); }
  100% { transform: none; }
}
@keyframes ready {
  50% { box-shadow: 0 0 0 3px var(--copper); }
}

@media (max-width: 860px) {
  .battle-top .name { flex: 1 1 100%; }
  .battle-top { gap: 6px; }
  .hero { grid-template-columns: 1fr; min-height: auto; gap: 18px; }
  .cards { grid-template-columns: 1fr; }
  .battle {
    grid-template-columns: 1fr;
    grid-template-areas:
      "top"
      "stage"
      "dock";
    padding: 8px 8px 20px;
  }
  .battle-top .name { font-size: 24px; }
  .mechs { flex-direction: row; }
  .unitcard {
    position: sticky;
    bottom: 8px;
    z-index: 15;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .compare { grid-template-columns: 1fr; }
  .mech { flex: 1; grid-template-columns: 1fr; padding: 8px 6px; min-width: 0; }
  .mech .mini-svg { display: none; }
  .keys { display: none; }
  .screen { padding: 18px 12px 32px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* КРОМКА — детерминированные правила боя.
   Модуль не трогает DOM. Состояние не мутируется: apply возвращает копию. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.KromkaLogic = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const SHELL_MIN = 2;
  const SHELL_MAX = 4;
  const PULL_MAX = 4;
  const WIDTH = 8;
  const HEIGHT = 8;

  const DIRS = [
    { id: 'N', x: 0, y: -1 },
    { id: 'E', x: 1, y: 0 },
    { id: 'S', x: 0, y: 1 },
    { id: 'W', x: -1, y: 0 },
  ];

  const KINDS = {
    klin: { side: 'player', move: 4, hp: 4, initiative: 0, weapon: 'strike', dmg: 1 },
    duga: { side: 'player', move: 3, hp: 4, initiative: 0, weapon: 'shell', dmg: 1 },
    kryuk: { side: 'player', move: 4, hp: 4, initiative: 0, weapon: 'pull', dmg: 0 },
    scara: { side: 'enemy', move: 3, hp: 2, initiative: 2, weapon: 'jab', dmg: 1 },
    needle: { side: 'enemy', move: 4, hp: 1, initiative: 3, weapon: 'lance', dmg: 1, length: 3 },
    hammer: { side: 'enemy', move: 2, hp: 3, initiative: 1, weapon: 'slam', dmg: 2 },
  };

  function dirById(id) {
    return DIRS.find((d) => d.id === id) || null;
  }

  function dirBetween(ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    if (dx === 0 && dy === -1) return 'N';
    if (dx === 1 && dy === 0) return 'E';
    if (dx === 0 && dy === 1) return 'S';
    if (dx === -1 && dy === 0) return 'W';
    return null;
  }

  function inb(state, x, y) {
    return x >= 0 && y >= 0 && x < state.w && y < state.h;
  }

  function tileAt(state, x, y) {
    return state.tiles[y * state.w + x];
  }

  function unitById(state, id) {
    return state.units.find((u) => u.id === id) || null;
  }

  function unitAt(state, x, y) {
    return state.units.find((u) => u.x === x && u.y === y) || null;
  }

  function illegal(msg) {
    const err = new Error(msg);
    err.code = 'illegal';
    throw err;
  }

  function cloneState(state) {
    return {
      id: state.id,
      name: state.name,
      w: state.w,
      h: state.h,
      maxTurn: state.maxTurn,
      turn: state.turn,
      status: state.status,
      lossReason: state.lossReason,
      gridHp: state.gridHp,
      gridMax: state.gridMax,
      kills: state.kills,
      tiles: state.tiles.map((t) => ({ ...t })),
      units: state.units.map((u) => ({ ...u })),
      spawns: state.spawns.map((s) => ({ ...s })),
    };
  }

  function parseMap(rows) {
    if (!rows || rows.length !== HEIGHT) throw new Error('карта должна быть 8×8');
    const tiles = [];
    for (let y = 0; y < HEIGHT; y++) {
      const row = rows[y];
      if (row.length !== WIDTH) throw new Error('длина ряда ' + y);
      for (let x = 0; x < WIDTH; x++) {
        const ch = row[x];
        const tile = { x, y, terrain: 'ground', hp: 0, maxHp: 0, spawn: false, objective: false, rubble: null };
        if (ch === '.') {
          /* ground */
        } else if (ch === '~') {
          tile.terrain = 'water';
        } else if (ch === '#') {
          tile.terrain = 'mountain';
          tile.hp = 2;
          tile.maxHp = 2;
        } else if (ch === 'B') {
          tile.terrain = 'building';
          tile.hp = 1;
          tile.maxHp = 1;
        } else if (ch === 'R') {
          tile.terrain = 'building';
          tile.hp = 2;
          tile.maxHp = 2;
          tile.objective = true;
        } else if (ch === 'S') {
          tile.spawn = true;
        } else {
          throw new Error('неизвестный тайл ' + ch);
        }
        tiles.push(tile);
      }
    }
    return tiles;
  }

  function actingOrder(units) {
    return units
      .filter((u) => u.side === 'enemy' && u.hp > 0)
      .slice()
      .sort((a, b) => {
        if (b.initiative !== a.initiative) return b.initiative - a.initiative;
        if (a.y !== b.y) return a.y - b.y;
        if (a.x !== b.x) return a.x - b.x;
        return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
      });
  }

  function assignOrders(state) {
    let n = 1;
    for (const enemy of actingOrder(state.units)) {
      if (enemy.attacking) enemy.order = n++;
      else enemy.order = 0;
    }
  }

  function createBattle(def) {
    const tiles = parseMap(def.map);
    let gridMax = 0;
    for (const t of tiles) if (t.terrain === 'building') gridMax += t.maxHp;
    const units = [];
    for (const spec of def.units || []) {
      const kind = KINDS[spec.kind];
      if (!kind) throw new Error('нет вида ' + spec.kind);
      const unit = {
        id: spec.id,
        side: kind.side,
        kind: spec.kind,
        x: spec.x,
        y: spec.y,
        hp: spec.hp != null ? spec.hp : kind.hp,
        maxHp: spec.hp != null ? spec.hp : kind.hp,
        move: kind.move,
        initiative: kind.initiative,
        dir: spec.dir || (kind.side === 'enemy' ? 'S' : 'N'),
        moved: false,
        acted: false,
        attacking: false,
        order: 0,
      };
      if (kind.side === 'enemy') {
        unit.attacking = spec.attacking != null ? !!spec.attacking : !!spec.dir;
      }
      if (!inb({ w: WIDTH, h: HEIGHT }, unit.x, unit.y)) throw new Error('юнит вне поля ' + unit.id);
      const tile = tiles[unit.y * WIDTH + unit.x];
      if (tile.terrain !== 'ground') throw new Error(unit.id + ' стоит на ' + tile.terrain);
      if (units.some((u) => u.x === unit.x && u.y === unit.y)) throw new Error('две фигуры в клетке ' + unit.id);
      units.push(unit);
    }
    const state = {
      id: def.id,
      name: def.name,
      w: WIDTH,
      h: HEIGHT,
      maxTurn: def.maxTurn || 5,
      turn: 1,
      status: 'playing',
      lossReason: null,
      gridHp: gridMax,
      gridMax,
      kills: 0,
      tiles,
      units,
      spawns: (def.spawns || []).map((s) => ({ ...s, done: false })),
    };
    assignOrders(state);
    return state;
  }

  function evaluate(state) {
    if (state.status !== 'playing') return;
    if (state.gridMax > 0 && state.gridHp <= 0) {
      state.status = 'lost';
      state.lossReason = 'grid';
      return;
    }
    if (!state.units.some((u) => u.side === 'player' && u.hp > 0)) {
      state.status = 'lost';
      state.lossReason = 'mechs';
    }
  }

  function removeUnit(state, id) {
    state.units = state.units.filter((u) => u.id !== id);
  }

  function killUnit(state, unit, events, cause) {
    events.push({
      t: 'death',
      id: unit.id,
      kind: unit.kind,
      side: unit.side,
      x: unit.x,
      y: unit.y,
      cause,
    });
    if (unit.side === 'enemy') state.kills += 1;
    removeUnit(state, unit.id);
    events.push({ t: 'shake', power: unit.side === 'player' ? 2 : 1 });
  }

  function damageUnit(state, unit, amount, events, cause, by) {
    if (!unit || amount <= 0) return 0;
    const live = unitById(state, unit.id);
    if (!live) return 0;
    const dealt = Math.min(live.hp, amount);
    live.hp -= dealt;
    events.push({
      t: 'damage',
      target: 'unit',
      id: live.id,
      kind: live.kind,
      side: live.side,
      amount: dealt,
      hpLeft: live.hp,
      x: live.x,
      y: live.y,
      lethal: live.hp <= 0,
      cause: cause || 'hit',
      by: by || null,
    });
    if (live.hp <= 0) killUnit(state, live, events, 'hp');
    return dealt;
  }

  function damageTile(state, x, y, amount, events, by) {
    if (!inb(state, x, y) || amount <= 0) return 0;
    const tile = tileAt(state, x, y);
    if (tile.terrain !== 'building' && tile.terrain !== 'mountain') return 0;
    const dealt = Math.min(tile.hp, amount);
    tile.hp -= dealt;
    events.push({
      t: 'damage',
      target: 'tile',
      terrain: tile.terrain,
      amount: dealt,
      hpLeft: tile.hp,
      x,
      y,
      lethal: tile.hp <= 0,
      objective: !!tile.objective,
      by: by || null,
    });
    if (tile.terrain === 'building') {
      state.gridHp -= dealt;
      events.push({ t: 'grid', hp: state.gridHp, max: state.gridMax, delta: -dealt });
    }
    if (tile.hp <= 0) {
      const was = tile.terrain;
      const objective = !!tile.objective;
      tile.terrain = 'ground';
      tile.rubble = was;
      tile.objective = false;
      tile.hp = 0;
      events.push({ t: 'terrain', x, y, terrain: 'ground', rubble: was, objective });
      events.push({ t: 'shake', power: was === 'building' ? 3 : 2 });
    } else if (tile.terrain === 'building') {
      events.push({ t: 'shake', power: 1 });
    }
    return dealt;
  }

  function hurtCell(state, x, y, amount, events, by) {
    const unit = unitAt(state, x, y);
    if (unit) {
      damageUnit(state, unit, amount, events, 'hit', by);
      return 'unit';
    }
    const tile = tileAt(state, x, y);
    if (tile.terrain === 'building' || tile.terrain === 'mountain') {
      damageTile(state, x, y, amount, events, by);
      return 'tile';
    }
    return null;
  }

  function pushUnit(state, unit, dir, events) {
    const live = unitById(state, unit.id);
    if (!live) return;
    const d = dirById(dir);
    const nx = live.x + d.x;
    const ny = live.y + d.y;
    const from = { x: live.x, y: live.y };
    if (!inb(state, nx, ny)) {
      damageUnit(state, live, 1, events, 'bump', null);
      events.push({ t: 'bump', id: live.id, x: live.x, y: live.y, dir, edge: true });
      events.push({ t: 'shake', power: 1 });
      return;
    }
    const other = unitAt(state, nx, ny);
    if (other && other.id !== live.id) {
      damageUnit(state, live, 1, events, 'bump', null);
      const otherLive = unitById(state, other.id);
      if (otherLive) damageUnit(state, otherLive, 1, events, 'bump', null);
      events.push({ t: 'bump', id: unit.id, otherId: other.id, x: nx, y: ny, dir, edge: false });
      events.push({ t: 'shake', power: 1 });
      return;
    }
    const tile = tileAt(state, nx, ny);
    if (tile.terrain === 'mountain' || tile.terrain === 'building') {
      damageUnit(state, live, 1, events, 'bump', null);
      damageTile(state, nx, ny, 1, events, live.id);
      events.push({ t: 'bump', id: unit.id, x: nx, y: ny, dir, terrain: tile.terrain, edge: false });
      events.push({ t: 'shake', power: 1 });
      return;
    }
    if (tile.terrain === 'water') {
      events.push({ t: 'push', id: live.id, from, to: { x: nx, y: ny }, dir, into: 'water' });
      live.x = nx;
      live.y = ny;
      killUnit(state, live, events, 'water');
      return;
    }
    events.push({ t: 'push', id: live.id, from, to: { x: nx, y: ny }, dir, into: 'ground' });
    live.x = nx;
    live.y = ny;
  }

  function walkable(state, x, y) {
    if (!inb(state, x, y)) return false;
    const tile = tileAt(state, x, y);
    if (tile.terrain !== 'ground') return false;
    if (unitAt(state, x, y)) return false;
    return true;
  }

  function pathTo(state, unitId, tx, ty) {
    const unit = unitById(state, unitId);
    if (!unit || !inb(state, tx, ty)) return null;
    if (unit.x === tx && unit.y === ty) return [{ x: unit.x, y: unit.y }];
    const prev = new Map();
    const startKey = unit.x + ',' + unit.y;
    prev.set(startKey, null);
    const q = [[unit.x, unit.y, 0]];
    let found = false;
    while (q.length) {
      const [x, y, dist] = q.shift();
      if (dist >= unit.move) continue;
      for (const d of DIRS) {
        const nx = x + d.x;
        const ny = y + d.y;
        const key = nx + ',' + ny;
        if (prev.has(key)) continue;
        if (!inb(state, nx, ny)) continue;
        if (unitAt(state, nx, ny)) continue;
        const tile = tileAt(state, nx, ny);
        if (tile.terrain !== 'ground') continue;
        prev.set(key, { x, y });
        if (nx === tx && ny === ty) {
          found = true;
          q.length = 0;
          break;
        }
        q.push([nx, ny, dist + 1]);
      }
    }
    if (!found) return null;
    const path = [{ x: tx, y: ty }];
    let cur = prev.get(tx + ',' + ty);
    while (cur) {
      path.push(cur);
      cur = prev.get(cur.x + ',' + cur.y);
    }
    path.reverse();
    if (path.length - 1 > unit.move) return null;
    return path;
  }

  function reachable(state, unitId) {
    const unit = unitById(state, unitId);
    if (!unit || unit.hp <= 0) return [];
    if (unit.side === 'player' && (unit.moved || unit.acted)) return [];
    const out = [{ x: unit.x, y: unit.y, dist: 0 }];
    const seen = new Set([unit.x + ',' + unit.y]);
    const q = [[unit.x, unit.y, 0]];
    while (q.length) {
      const [x, y, dist] = q.shift();
      if (dist >= unit.move) continue;
      for (const d of DIRS) {
        const nx = x + d.x;
        const ny = y + d.y;
        const key = nx + ',' + ny;
        if (seen.has(key) || !inb(state, nx, ny)) continue;
        if (unitAt(state, nx, ny)) continue;
        if (tileAt(state, nx, ny).terrain !== 'ground') continue;
        seen.add(key);
        q.push([nx, ny, dist + 1]);
        out.push({ x: nx, y: ny, dist: dist + 1 });
      }
    }
    return out;
  }

  function weaponTargets(state, unitId) {
    const unit = unitById(state, unitId);
    if (!unit || unit.hp <= 0 || unit.side !== 'player' || unit.acted) return [];
    if (unit.kind === 'klin') {
      const res = [];
      for (const d of DIRS) {
        const x = unit.x + d.x;
        const y = unit.y + d.y;
        if (!inb(state, x, y)) continue;
        const occ = unitAt(state, x, y);
        const tile = tileAt(state, x, y);
        if (occ || tile.terrain === 'building' || tile.terrain === 'mountain') {
          res.push({ x, y, mode: occ ? 'unit' : 'terrain' });
        }
      }
      return res;
    }
    if (unit.kind === 'duga') {
      const res = [];
      for (let y = 0; y < state.h; y++) {
        for (let x = 0; x < state.w; x++) {
          const dist = Math.max(Math.abs(x - unit.x), Math.abs(y - unit.y));
          if (dist >= SHELL_MIN && dist <= SHELL_MAX) res.push({ x, y, mode: 'shell' });
        }
      }
      return res;
    }
    if (unit.kind === 'kryuk') {
      const res = [];
      for (const d of DIRS) {
        for (let i = 1; i <= PULL_MAX; i++) {
          const x = unit.x + d.x * i;
          const y = unit.y + d.y * i;
          if (!inb(state, x, y)) break;
          const occ = unitAt(state, x, y);
          if (occ) {
            res.push({ x, y, mode: 'pull', unitId: occ.id });
            break;
          }
          const tile = tileAt(state, x, y);
          if (tile.terrain === 'building' || tile.terrain === 'mountain') break;
        }
      }
      return res;
    }
    return [];
  }

  function doMove(state, cmd, events) {
    const unit = unitById(state, cmd.unitId);
    if (!unit || unit.side !== 'player' || unit.hp <= 0) illegal('нет станка');
    if (unit.moved || unit.acted) illegal('уже ходил');
    if (unit.x === cmd.x && unit.y === cmd.y) illegal('та же клетка');
    const path = pathTo(state, unit.id, cmd.x, cmd.y);
    if (!path) illegal('нет пути');
    const last = path[path.length - 2] || path[0];
    const face = dirBetween(last.x, last.y, cmd.x, cmd.y);
    events.push({ t: 'move', id: unit.id, path, side: 'player', kind: unit.kind });
    unit.x = cmd.x;
    unit.y = cmd.y;
    if (face) unit.dir = face;
    unit.moved = true;
  }

  function strike(state, unit, tx, ty, events) {
    const dir = dirBetween(unit.x, unit.y, tx, ty);
    if (!dir) illegal('клин бьёт только рядом');
    const occ = unitAt(state, tx, ty);
    const tile = tileAt(state, tx, ty);
    if (!occ && tile.terrain !== 'building' && tile.terrain !== 'mountain') illegal('нечего бить');
    events.push({
      t: 'shot',
      kind: 'jab',
      from: { x: unit.x, y: unit.y },
      to: { x: tx, y: ty },
      dir,
      by: unit.id,
    });
    unit.dir = dir;
    if (occ) {
      const id = occ.id;
      damageUnit(state, occ, 1, events, 'hit', unit.id);
      const still = unitById(state, id);
      if (still) pushUnit(state, still, dir, events);
    } else {
      damageTile(state, tx, ty, 1, events, unit.id);
    }
  }

  function shell(state, unit, tx, ty, events) {
    const dist = Math.max(Math.abs(tx - unit.x), Math.abs(ty - unit.y));
    if (dist < SHELL_MIN || dist > SHELL_MAX) illegal('вне дуги');
    if (!inb(state, tx, ty)) illegal('вне поля');
    const face = dirBetween(unit.x, unit.y, tx, ty) || (Math.abs(tx - unit.x) >= Math.abs(ty - unit.y)
      ? (tx > unit.x ? 'E' : 'W')
      : (ty > unit.y ? 'S' : 'N'));
    unit.dir = face;
    events.push({
      t: 'shot',
      kind: 'shell',
      from: { x: unit.x, y: unit.y },
      to: { x: tx, y: ty },
      dir: face,
      by: unit.id,
    });
    const snaps = DIRS.map((d) => {
      const x = tx + d.x;
      const y = ty + d.y;
      if (!inb(state, x, y)) return { dir: d.id, id: null };
      const occ = unitAt(state, x, y);
      return { dir: d.id, id: occ ? occ.id : null };
    });
    hurtCell(state, tx, ty, 1, events, unit.id);
    for (const snap of snaps) {
      if (!snap.id) continue;
      const occ = unitById(state, snap.id);
      if (!occ) continue;
      pushUnit(state, occ, snap.dir, events);
    }
  }

  function pull(state, unit, tx, ty, events) {
    const target = unitAt(state, tx, ty);
    if (!target) illegal('некого тянуть');
    if (target.id === unit.id) illegal('себя');
    const dx = Math.sign(tx - unit.x);
    const dy = Math.sign(ty - unit.y);
    if ((dx !== 0 && dy !== 0) || (dx === 0 && dy === 0)) illegal('не по прямой');
    const dist = Math.abs(tx - unit.x) + Math.abs(ty - unit.y);
    if (dist > PULL_MAX) illegal('далеко');
    for (let i = 1; i < dist; i++) {
      const x = unit.x + dx * i;
      const y = unit.y + dy * i;
      if (unitAt(state, x, y)) illegal('цепь занята');
      const tile = tileAt(state, x, y);
      if (tile.terrain === 'building' || tile.terrain === 'mountain') illegal('цепь заперта');
    }
    const toward = dirBetween(tx, ty, tx - dx, ty - dy);

    else if (unit.kind === 'kryuk') pull(state, unit, cmd.x, cmd.y, events);

  function doWait(state, cmd, events) {

  function rayTiles(state, origin, dir, length) {

        if (occ || tile.terrain === 'building' || tile.terrain === 'mountain') {

      const p = { x: enemy.x + d.x, y: enemy.y + d.y };
      events.push({ t: 'shot', kind: kind.weapon, from: { x: enemy.x, y: enemy.y }, to: p, dir: enemy.dir, by: enemy.id, tiles: info ? info.tiles : [] });

        events.push({ t: 'whiff', by: enemy.id });
        return;
      }
      const hit = hurtCell(state, p.x, p.y, kind.dmg, events, enemy.id);
      if (!hit) events.push({ t: 'whiff', by: enemy.id });

    }

      const last = tiles[tiles.length - 1] || { x: enemy.x, y: enemy.y };

        t: 'shot',
        kind: 'lance',

        by: enemy.id,

        side: 'enemy',
        kind: spec.kind,
        x: spec.x,
        y: spec.y,

        const y = spot.y + d.y * i;

    const events = [];
    try {

      else if (cmd.type === 'act') doAct(next, cmd, events);

      session.state = session.past.pop();
      return { ok: true, session, events: [], state: session.state };

    if (cmd.type === 'reset') {

      gridMax: state.gridMax,

    applyAll,

    previewResolution,
    reachable,
    weaponTargets,
    pathTo,
    scoreBreakdown,
    tileAt,
    unitAt,
    unitById,
    livingPlayers,
    inb,
    walkable,
