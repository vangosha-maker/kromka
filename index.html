    this.tilesEl.addEventListener('click', (e) => {
      const tile = e.target.closest('.tile');
      if (!tile) return;
      this.onTile(+tile.dataset.x, +tile.dataset.y);
    });
    this.tilesEl.addEventListener('pointermove', (e) => {
      if (!this.fine) return;
      const tile = e.target.closest('.tile');
      if (!tile) return;
      this.onHover(+tile.dataset.x, +tile.dataset.y);
    });
    this.tilesEl.addEventListener('pointerleave', () => {
      if (!this.fine) return;
      this.hover = null;
      this.paintOverlay();
      this.paintForecast();
    });
    this.app.querySelector('[data-back]').onclick = () => { this.persist(); this.showSelect(); };
    this.app.querySelector('[data-help]').onclick = () => this.openHelp();
    this.app.querySelector('.sound').onclick = () => {
      this.soundOn = !this.soundOn;
      this.persist();
      this.paintChrome();
      if (this.soundOn) { this.ensureAudio(); this.blip('move'); }
    };
    this.app.querySelector('[data-undo]').onclick = () => this.doUndo();
    this.app.querySelector('[data-reset]').onclick = () => this.doReset();
    this.app.querySelector('[data-end]').onclick = () => this.doEnd();
    this.app.querySelector('#next-hint').onclick = () => this.tutNext();
    this.app.querySelector('#skip-tut').onclick = () => this.tutSkip();
    this.app.querySelector('#confirm').onclick = () => {
      const step = this.tutStep();
      if (step && step.allow.type !== 'confirm') return this.deny();
      if (!this.armed) return this.deny();
      this.commit(this.armed.intent, this.armed.x, this.armed.y);
    };
    this.app.querySelectorAll('[data-mode]').forEach((btn) => {
      btn.onclick = () => {
        if (this.tutStep()) return this.deny();
        if (btn.dataset.mode === 'wait') this.doWait();
        else { this.mode = btn.dataset.mode; this.armed = null; this.paintModes(); this.paintOverlay(); }
      };
    });
    this.layout();
    this.draw();
  };

  Game.prototype.layout = function () {
    if (!this.board) return;
    const stage = this.app.querySelector('.stage');
    const width = stage.clientWidth - 8;
    const gap = width < 560 ? 2 : 4;
    const tile = Math.max(36, Math.min(68, Math.floor((width - gap * 7 - 20) / 8)));
    this.tile = tile;
    this.gap = gap;
    this.board.style.setProperty('--tile', tile + 'px');
    this.board.style.setProperty('--gap', gap + 'px');
    const size = tile * 8 + gap * 7;
    this.fx.setAttribute('width', size);
    this.fx.setAttribute('height', size);
    this.fx.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    this.placePieces();
  };

  Game.prototype.draw = function () {
    if (this.screen !== 'battle' || !this.session) return;
    this.paintChrome();
    this.paintMechs();
    this.paintTiles();
    this.paintPieces();
    this.paintModes();
    this.paintOverlay();
    this.paintForecast();
    this.paintHint();
    this.paintCard();
    this.paintThreats();
    this.paintEnd();
  };

  Game.prototype.paintChrome = function () {
    const state = this.session.state;
    this.app.querySelector('.name').textContent = this.battle.name;
    const turnShown = Math.min(state.turn, state.maxTurn);
    this.app.querySelector('#turn').textContent = 'Ход ' + turnShown + ' из ' + state.maxTurn;
    this.app.querySelector('#gridnum').textContent = Math.max(0, state.gridHp) + '/' + state.gridMax;
    const pips = this.app.querySelector('#pips');
    pips.innerHTML = '';
    for (let i = 0; i < state.gridMax; i++) {
      const pip = document.createElement('i');
      if (i < state.gridHp) pip.className = 'on';
      pips.appendChild(pip);
    }
    const sound = this.app.querySelector('.sound');
    sound.textContent = this.soundOn ? 'Звук вкл' : 'Звук выкл';
    sound.setAttribute('aria-pressed', this.soundOn ? 'true' : 'false');
    const canUndo = this.session.past.length > 0 && state.status === 'playing' && !this.busy;
    this.app.querySelector('[data-undo]').disabled = !canUndo;
    this.app.querySelector('[data-reset]').disabled = !canUndo;
    const end = this.app.querySelector('[data-end]');
    end.disabled = this.busy || state.status !== 'playing';
    const idle = state.units.filter((u) => u.side === 'player' && u.hp > 0 && !u.acted);
    end.classList.toggle('ready', idle.length === 0 && state.status === 'playing');
  };

  Game.prototype.paintTiles = function () {
    const state = this.session.state;
    if (this.tilesEl.childElementCount !== 64) {
      this.tilesEl.innerHTML = '';
      this.tileNodes = [];
      for (let y = 0; y < 8; y++) {
        for (let x = 0; x < 8; x++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tile';
          btn.dataset.x = String(x);
          btn.dataset.y = String(y);
          const deco = document.createElement('div');
          deco.className = 'deco';
          btn.appendChild(deco);
          this.tilesEl.appendChild(btn);
          this.tileNodes.push(btn);
        }
      }
    }
    state.tiles.forEach((tile, i) => {
      const el = this.tileNodes[i];
      const classes = ['tile'];
      if ((tile.x + tile.y) % 2 === 0 && tile.terrain === 'ground' && !tile.rubble) classes.push('alt');
      if (tile.terrain === 'water') classes.push('water');
      else if (tile.terrain === 'mountain') classes.push('mountain');
      else if (tile.terrain === 'building') classes.push('building', tile.objective ? 'objective' : 'shop');
      if (tile.rubble) classes.push('rubble-' + tile.rubble);
      if (tile.spawn) classes.push('spawn');
      el.className = classes.join(' ');
      el.setAttribute('aria-label', labelTile(tile));
      el.querySelector('.deco').innerHTML = decoOf(tile);
      if (!el.querySelector('.ord-tile')) {
        const badge = document.createElement('span');
        badge.className = 'ord-tile';
        badge.hidden = true;
        el.appendChild(badge);
      }
    });
  };

  Game.prototype.paintPieces = function () {
    const state = this.session.state;
    const have = new Set();
    for (const unit of state.units) {
      have.add(unit.id);
      const passport = this.units.profile(unit.kind);
      let el = this.piecesEl.querySelector('[data-id="' + unit.id + '"]');
      if (!el) {
        el = document.createElement('div');
        el.dataset.id = unit.id;
        el.innerHTML = '<div class="rot"></div><span class="atk-icon"></span><span class="tag"></span><span class="badge" hidden></span><span class="hp"></span>';
        this.piecesEl.appendChild(el);
      }
      el.className = 'piece ' + (unit.side === 'player' ? 'player' : 'enemy') + (unit.id === this.selectedId ? ' selected' : '');
      el.style.setProperty('--accent', passport.accent);
      el.querySelector('.atk-icon').innerHTML = attackIcon(passport.icon);
      el.querySelector('.rot').innerHTML = svgUnit(unit.kind);
      el.querySelector('.rot').style.transform = 'rotate(' + (ROT[unit.dir] || 0) + 'deg)';
      el.querySelector('.tag').textContent = TAG[unit.kind];
      const badge = el.querySelector('.badge');
      if (unit.attacking && unit.order) {
        badge.hidden = false;
        badge.textContent = String(unit.order);
      } else badge.hidden = true;
      const hp = el.querySelector('.hp');
      hp.innerHTML = '';
      for (let i = 0; i < unit.maxHp; i++) {
        const pip = document.createElement('i');
        if (i < unit.hp) pip.className = 'on';
        hp.appendChild(pip);
      }
    }
    this.piecesEl.querySelectorAll('.piece').forEach((el) => {
      if (!have.has(el.dataset.id)) el.remove();
    });
    this.placePieces();
  };

  Game.prototype.placePieces = function () {
    if (!this.piecesEl || !this.session) return;
    const step = this.tile + this.gap;
    for (const unit of this.session.state.units) {
      const el = this.piecesEl.querySelector('[data-id="' + unit.id + '"]');
      if (!el) continue;
      el.style.transform = 'translate(' + (unit.x * step) + 'px,' + (unit.y * step) + 'px)';
    }
  };

  Game.prototype.selected = function () {
    if (!this.selectedId) return null;
    return this.logic.unitById(this.session.state, this.selectedId);
  };

  Game.prototype.paintMechs = function () {
    const box = this.app.querySelector('.mechs');
    if (!box) return;
    const order = ['klin', 'duga', 'kryuk'];
    box.innerHTML = order.map((id) => {
      const unit = this.logic.unitById(this.session.state, id);
      if (!unit) return '';
      const passport = this.units.profile(id);
      const status = unit.hp <= 0 ? 'пал' : unit.acted ? 'ударил' : unit.moved ? 'уже шёл' : 'готов';
      return '<button type="button" class="mech' + (id === this.selectedId ? ' on' : '') + '" data-pick="' + id + '" style="--accent:' + passport.accent + '">' +
        '<div class="mini-svg">' + svgUnit(unit.kind) + '<span class="atk-icon">' + attackIcon(passport.icon) + '</span></div>' +
        '<div><div class="who">' + passport.name + ' ' + unit.hp + '/' + unit.maxHp + '</div>' +
        '<div class="sub">' + status + ' · ' + passport.role + '</div></div></button>';
    }).join('');
    box.querySelectorAll('[data-pick]').forEach((btn) => {
      btn.onclick = () => {
        this.showCard(btn.dataset.pick);
        this.select(btn.dataset.pick);
      };
    });
  };

  Game.prototype.paintModes = function () {
    const box = this.app.querySelector('.modes');
    const mech = this.selected();
    const show = mech && mech.hp > 0 && !mech.acted && this.session.state.status === 'playing' && !this.tutStep();
    box.hidden = !show;
    box.querySelectorAll('button').forEach((btn) => {
      btn.classList.toggle('on', btn.dataset.mode === this.mode);
      if (btn.dataset.mode === 'move') btn.disabled = !!(mech && mech.moved);
    });
  };

  Game.prototype.intentAt = function (x, y) {
    const mech = this.selected();
    if (!mech || mech.acted || mech.hp <= 0) return null;
    const state = this.session.state;
    const reach = this.logic.reachable(state, mech.id);
    const targets = this.logic.weaponTargets(state, mech.id);
    const canMove = reach.some((t) => t.x === x && t.y === y && (t.x !== mech.x || t.y !== mech.y));
    const canAct = targets.some((t) => t.x === x && t.y === y);
    if (this.mode === 'move' && canMove) return 'move';
    if (this.mode === 'weapon' && canAct) return 'act';
    if (this.mode === 'move' && canAct && !canMove) return 'act';
    return null;
  };

  Game.prototype.paintOverlay = function () {
    const state = this.session.state;
    const focus = this.armed || this.hover;
    for (const el of this.tileNodes || []) {
      el.classList.remove('move', 'weapon', 'tele', 'impact', 'cursor', 'coach');
    }
    const mark = (x, y, cls) => {
      const el = this.tileNodes[y * 8 + x];
      if (el) el.classList.add(cls);
    };
    if (this.cursorOn && this.cursor) mark(this.cursor.x, this.cursor.y, 'cursor');
    for (const el of this.tileNodes || []) {
      const badge = el.querySelector('.ord-tile');
      if (badge) { badge.hidden = true; badge.textContent = ''; }
    }
    const mech = this.selected();
    if (mech && !mech.acted && state.status === 'playing') {
      if (!mech.moved && this.mode === 'move') {
        for (const cell of this.logic.reachable(state, mech.id)) {
          if (cell.x !== mech.x || cell.y !== mech.y) mark(cell.x, cell.y, 'move');
        }
      }
      if (this.mode === 'weapon') {
        for (const cell of this.logic.weaponTargets(state, mech.id)) mark(cell.x, cell.y, 'weapon');
      }
    }
    const previewState = focus ? this.previewCommand(focus) : null;
    const show = previewState ? previewState.state : state;
    for (const unit of show.units) {
      if (unit.side !== 'enemy' || !unit.attacking) continue;
      const info = this.logic.telegraph(show, unit);
      if (!info) continue;
      for (const cell of info.tiles) mark(cell.x, cell.y, 'tele');
      if (info.impact) mark(info.impact.x, info.impact.y, 'impact');
    }
    this.drawArrows(show, previewState);
  };

  Game.prototype.previewCommand = function (focus) {
    if (!focus) return null;
    const cmd = focus.intent === 'move'
      ? { type: 'move', unitId: this.selectedId, x: focus.x, y: focus.y }
      : { type: 'act', unitId: this.selectedId, x: focus.x, y: focus.y };
    const result = this.logic.apply(this.session.state, cmd);
    if (!result.ok) return null;
    return result;
  };

  Game.prototype.attackShape = function (pt, step) {
    const mech = this.selected();
    if (!mech || mech.hp <= 0 || mech.acted) return '';
    const dirs = [
      { x: 0, y: -1 },
      { x: 1, y: 0 },
      { x: 0, y: 1 },
      { x: -1, y: 0 },
    ];
    if (mech.kind === 'duga') {
      const square = (dist) => {
        const x = (mech.x - dist) * step;
        const y = (mech.y - dist) * step;
        const size = dist * 2 * step + this.tile;
        return '<rect x="' + x + '" y="' + y + '" width="' + size + '" height="' + size + '" fill="none" stroke="#ffc14d" stroke-width="2" stroke-dasharray="6 4"/>';
      };
      return square(4) + square(1);
    }
    let out = '';
    for (const dir of dirs) {
      if (mech.kind === 'klin') {
        const nx = mech.x + dir.x;
        const ny = mech.y + dir.y;
        if (!this.logic.inb(this.session.state, nx, ny)) continue;
        const from = pt(mech.x, mech.y);
        const to = pt(nx, ny);
        const x1 = from.x + (to.x - from.x) * 0.42;
        const y1 = from.y + (to.y - from.y) * 0.42;
        const x2 = from.x + (to.x - from.x) * 0.92;
        const y2 = from.y + (to.y - from.y) * 0.92;
        out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#ffc14d" stroke-width="3" marker-end="url(#ap)"/>';
        out += '<circle cx="' + to.x + '" cy="' + to.y + '" r="5" fill="#ffc14d" opacity="0.9"/>';
      }
      if (mech.kind === 'kryuk') {
        let fx = mech.x;
        let fy = mech.y;
        for (let i = 1; i <= 4; i++) {
          const nx = mech.x + dir.x * i;
          const ny = mech.y + dir.y * i;
          if (!this.logic.inb(this.session.state, nx, ny)) break;
          fx = nx;
          fy = ny;
        }
        if (fx === mech.x && fy === mech.y) continue;
        const far = pt(fx, fy);
        const near = pt(mech.x, mech.y);
        out += '<line x1="' + far.x + '" y1="' + far.y + '" x2="' + near.x + '" y2="' + near.y + '" stroke="#3ec8c0" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#aq)"/>';
      }
    }
    return out;
  };

  Game.prototype.drawArrows = function (show, preview) {
    const size = this.tile * 8 + this.gap * 7;
    const mid = this.tile / 2;
    const step = this.tile + this.gap;
    const pt = (x, y) => ({ x: x * step + mid, y: y * step + mid });
    let svg = '<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#ff5d6e"/></marker>' +
      '<marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#ffc14d"/></marker>' +
      '<marker id="aq" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#3ec8c0"/></marker></defs>';
    svg += this.attackShape(pt, step);
    for (const unit of show.units) {
      if (unit.side !== 'enemy' || !unit.attacking) continue;
      const info = this.logic.telegraph(show, unit);
      if (!info) continue;
      const from = pt(unit.x, unit.y);
      const dest = info.impact || info.tiles[info.tiles.length - 1];
      if (!dest) continue;
      const to = pt(dest.x, dest.y);
      svg += '<line class="arrow" x1="' + from.x + '" y1="' + from.y + '" x2="' + to.x + '" y2="' + to.y + '" marker-end="url(#ah)"/>';
      if (info.impact) {
        const p = pt(info.impact.x, info.impact.y);
        svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="12" fill="#fff" stroke="#e23d3d" stroke-width="2"/>';
        svg += '<text x="' + p.x + '" y="' + (p.y + 5) + '" text-anchor="middle" fill="#8d140c" font-size="14" font-weight="700" font-family="sans-serif">' + unit.order + '</text>';
      }
    }
    if (preview) {
      for (const e of preview.events) {
        if (e.t !== 'push') continue;
        const a = pt(e.from.x, e.from.y);
        const b = pt(e.to.x, e.to.y);
        svg += '<line class="arrow push" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" marker-end="url(#ap)"/>';
      }
      for (const e of preview.events) {
        if (e.t === 'death') {
          const p = pt(e.x, e.y);
          svg += '<text class="mark" x="' + p.x + '" y="' + p.y + '" text-anchor="middle" fill="#fff" font-size="18" font-family="sans-serif">✕</text>';
        } else if (e.t === 'damage') {
          const p = pt(e.x, e.y);
          svg += '<text class="mark" x="' + p.x + '" y="' + (p.y - 10) + '" text-anchor="middle" fill="#ffe1dc" font-size="14" font-weight="700" font-family="sans-serif">−' + e.amount + '</text>';
        }
      }
    }
    this.fx.setAttribute('width', size);
    this.fx.setAttribute('height', size);
    this.fx.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    this.fx.innerHTML = svg;
  };

  Game.prototype.paintForecast = function () {
    const box = this.app.querySelector('.forecast');
    const focus = this.armed || this.hover;
    const preview = focus ? this.previewCommand(focus) : null;
    if (preview) {
      const lines = narrate(preview.events);
      const future = this.logic.previewResolution(preview.state);
      const lost = this.session.state.gridHp - future.state.gridHp;
      const tail = lost > 0 ? 'После этого энергия зданий −' + lost : 'После этого энергия зданий цела';
      box.className = 'forecast' + (lost > 0 ? ' bad' : '');
      box.innerHTML = '<strong>Если подтвердить</strong>' + list(lines.length ? lines : ['Без урона']) + '<p><strong>' + tail + '</strong></p>';
      return;
    }
    const future = this.logic.previewResolution(this.session.state);
    const lost = this.session.state.gridHp - future.state.gridHp;
    box.className = 'forecast' + (lost > 0 ? ' bad' : '');
    const lines = narrate(future.events);
    const head = lost > 0 ? 'Если нажать «Конец хода», энергия −' + lost : 'Если нажать «Конец хода», энергия цела';
    box.innerHTML = '<strong>' + head + '</strong>' + list(lines);
  };

  Game.prototype.tutStep = function () {
    return this.tutorial ? this.tutorial.current(this.tut) : null;
  };

  Game.prototype.tutNext = function () {
    const step = this.tutStep();
    if (!step || !this.tutorial.advance(this.tut, { type: 'next' }).ok) return this.deny();
    if (this.tut.done) {
      this.store.tutorialDone = true;
      this.persist();
    }
    this.draw();
  };

  Game.prototype.tutSkip = function () {
    if (!this.tut) return;
    this.tutorial.skip(this.tut);
    this.store.tutorialDone = true;
    this.persist();
    this.draw();
  };

  Game.prototype.deny = function () {
    const bar = this.app.querySelector('#nowbar');
    if (!bar) return;
    bar.classList.remove('nope');
    void bar.offsetWidth;
    bar.classList.add('nope');
  };

  Game.prototype.freeHint = function () {
    const state = this.session.state;
    if (state.status !== 'playing') return 'Бой окончен.';
    const mechs = state.units.filter((u) => u.side === 'player' && u.hp > 0);
    const waiting = mechs.filter((u) => !u.acted);
    if (!waiting.length) return 'Все мехи походили. Нажмите «Конец хода».';
    if (!this.selectedId) return 'Что делать сейчас: выберите меха.';
    const mech = this.selected();
    if (!mech || mech.acted) return 'Этот мех уже походил. Выберите другого или нажмите «Конец хода».';
    if (!mech.moved) return 'Что делать сейчас: синяя клетка — пойти, жёлтая — ударить.';
    return 'Что делать сейчас: нажмите жёлтую клетку, затем «Ударить».';
  };

  Game.prototype.paintHint = function () {
    const step = this.tutStep();
    const now = this.app.querySelector('#now');
    const next = this.app.querySelector('#next-hint');
    const skip = this.app.querySelector('#skip-tut');
    const dockHint = this.app.querySelector('.hint');
    if (dockHint) dockHint.hidden = true;
    document.body.classList.toggle('teaching', !!step);
    if (!now) return;
    if (step && step.id.indexOf('meet-') === 0 && step.hot && step.hot.id) this.cardId = step.hot.id;
    now.textContent = step ? step.text : this.freeHint();
    if (next) next.hidden = !(step && step.allow.type === 'next');
    if (skip) skip.hidden = !step;
    const confirm = this.app.querySelector('#confirm');
    if (confirm && step && step.allow.type === 'confirm') {
      confirm.hidden = false;
      confirm.textContent = 'Ударить';
    }
    this.paintSpotlight(step);
  };

  Game.prototype.paintSpotlight = function (step) {
    this.app.querySelectorAll('.tut-hot').forEach((el) => el.classList.remove('tut-hot'));
    const arrow = this.app.querySelector('#tut-arrow');
    if (!step) {
      if (arrow) arrow.hidden = true;
      return;
    }
    const hot = step.hot || {};
    let aim = null;
    const mark = (el, primary) => {
      if (!el) return;
      el.classList.add('tut-hot');
      if (primary || !aim) aim = el;
    };
    if (hot.kind === 'energy') mark(this.app.querySelector('.gridbar'), true);
    if (hot.kind === 'unit') {
      mark(this.piecesEl.querySelector('[data-id="' + hot.id + '"]'), true);
      mark(this.app.querySelector('[data-pick="' + hot.id + '"]'), false);
    }
    if (hot.kind === 'tile' && this.tileNodes) mark(this.tileNodes[hot.y * 8 + hot.x], true);
    if (hot.kind === 'impacts') {
      this.app.querySelectorAll('.tile.impact').forEach((el, i) => mark(el, i === 0));
    }
    if (hot.kind === 'confirm') mark(this.app.querySelector('#confirm'), true);
    if (hot.kind === 'end') mark(this.app.querySelector('[data-end]'), true);
    if (hot.kind === 'next' || step.allow.type === 'next') mark(this.app.querySelector('#next-hint'), hot.kind === 'next');
    if (!arrow || !aim) {
      if (arrow) arrow.hidden = true;
      return;
    }
    const rect = aim.getBoundingClientRect();
    arrow.hidden = false;
    arrow.style.left = (rect.left + rect.width / 2 - 12) + 'px';
    arrow.style.top = Math.max(4, rect.top - 30) + 'px';
  };

  Game.prototype.noteCommand = function (cmd) {
    const step = this.tutStep();
    if (!step) return;
    let action = null;
    if (cmd.type === 'move') action = { type: 'move', unitId: cmd.unitId, x: cmd.x, y: cmd.y };
    else if (cmd.type === 'act' && step.allow.type === 'confirm') action = { type: 'confirm' };
    else if (cmd.type === 'end') action = { type: 'end' };
    if (action) this.tutorial.advance(this.tut, action);
  };

  Game.prototype.paintThreats = function () {
    const box = this.app.querySelector('#threats');
    const units = this.session.state.units
      .filter((u) => u.side === 'enemy' && u.attacking)
      .slice()
      .sort((a, b) => a.order - b.order);
    if (!units.length) { box.innerHTML = ''; return; }
    box.innerHTML = units.map((u) => {
      const info = this.logic.telegraph(this.session.state, u);
      let what = 'мимо';
      if (info && info.impact) {
        what = info.impact.what === 'building' ? 'по зданию' : info.impact.what === 'mountain' ? 'по горе' : 'по фигуре';
      }
      return '<div><span class="ord">' + u.order + '</span><span>' + NAME[u.kind] + ' · ' + DIR[u.dir] + ' · ' + what + '</span></div>';
    }).join('');
  };

  Game.prototype.paintEnd = function () {
    const state = this.session.state;
    const layer = this.app.querySelector('.end');
    if (!layer) return;
    if (state.status === 'playing' || this.busy) { layer.hidden = true; return; }
    const score = this.logic.scoreBreakdown(state);
    const win = state.status === 'won';
    if (win) {
      const prev = this.store.cleared[this.battle.id];
      if (!prev || score.total >= prev.score) {
        this.store.cleared[this.battle.id] = {
          score: score.total,
          grid: score.grid,
          gridMax: score.gridMax,
          kills: score.kills,
          mechs: score.mechs,
        };
      }
      this.store.tutorialDone = this.store.tutorialDone || this.battle.tutorial;
      this.store.resume = null;
      saveStore(this.store);
    }
    layer.hidden = false;
    layer.querySelector('.end-card').className = 'end-card ' + (win ? 'win' : 'lose');
    const reason = state.lossReason === 'mechs' ? 'Мехи пали' : 'Энергия кончилась';
    layer.querySelector('.end-card').innerHTML =
      '<div class="sparks"></div>' +
      '<h2>' + (win ? 'Здания целы' : reason) + '</h2>' +
      '<p class="sub">' + this.battle.name + ' · ход ' + Math.min(state.turn, state.maxTurn) + '</p>' +
      row('Энергия зданий', score.grid + '/' + score.gridMax) +
      row('Враги сняты', String(score.kills)) +
      row('Мехи', score.mechs + '/3') +
      '<div class="score-row total"><span>Очки</span><span>' + score.total + '</span></div>' +
      '<p class="sub">Энергия × 100 + враги × 25 + мехи × 50</p>' +
      '<div class="end-actions"><button class="primary" type="button" data-again>Ещё раз</button><button type="button" data-list>К боям</button></div>';
    layer.querySelector('[data-again]').onclick = () => this.startBattle(this.battle.id);
    layer.querySelector('[data-list]').onclick = () => this.showSelect();
  };

  Game.prototype.showCard = function (id) {
    this.cardId = id;
    this.paintCard();
  };

  Game.prototype.paintCard = function () {
    const card = this.app.querySelector('.unitcard');
    if (!card || !this.session) return;
    const unit = this.cardId ? this.logic.unitById(this.session.state, this.cardId) : null;
    if (!unit) {
      card.hidden = true;
      return;
    }
    const passport = this.units.profile(unit.kind);
    let pips = '';
    for (let i = 0; i < unit.maxHp; i++) pips += '<i class="' + (i < unit.hp ? 'on' : '') + '"></i>';
    let now = '';
    if (unit.side === 'enemy') {
      const info = this.logic.telegraph(this.session.state, unit);
      now = '<p class="uc-now">' + this.units.describeHit(unit, info && info.impact) + '</p>';
    }
    card.hidden = false;
    card.innerHTML = '<div class="uc-top" style="--accent:' + passport.accent + '">' +
      svgUnit(unit.kind).replace('<svg', '<svg width="52" height="52"') +
      '<span class="atk-icon">' + attackIcon(passport.icon) + '</span>' +
      '<div><b>' + passport.name + '</b><div>' + passport.role + '</div>' +
      '<div class="sub">ход ' + passport.move + '</div></div>' +
      '<button type="button" class="ghost" data-close>Закрыть</button></div>' +
      '<div class="uc-pips">' + pips + '</div>' +
      diagramHtml(unit.kind) + now;
    const close = card.querySelector('[data-close]');
    if (close) close.onclick = () => { this.cardId = null; card.hidden = true; };
  };

  Game.prototype.onTile = function (x, y) {
    if (this.busy || this.session.state.status !== 'playing') return;
    this.cursor = { x, y };
    const occ = this.logic.unitAt(this.session.state, x, y);
    if (occ) this.showCard(occ.id);
    const step = this.tutStep();
    if (occ && occ.side === 'player' && (!this.selectedId || (occ.id !== this.selectedId && this.intentAt(x, y) !== 'act'))) {
      this.select(occ.id);
      return;
    }
    const intent = this.selectedId ? this.intentAt(x, y) : null;
    if (step) {
      if (step.allow.type === 'move' && intent === 'move') {
        if (!this.tutorial.allows(step, { type: 'move', unitId: this.selectedId, x: x, y: y })) return this.deny();
        this.commit('move', x, y);
        return;
      }
      if (step.allow.type === 'arm' && intent === 'act') {
        if (!this.tutorial.allows(step, { type: 'arm', intent: 'act', x: x, y: y })) return this.deny();
        this.armed = { intent: 'act', x: x, y: y };
        this.tutorial.advance(this.tut, { type: 'arm', intent: 'act', x: x, y: y });
        this.draw();
        return;
      }
      return this.deny();
    }
    if (!this.selectedId) return;
    if (!intent) { this.paintOverlay(); return; }
    if (this.fine && intent === 'move') this.commit(intent, x, y);
    else if (this.fine && intent === 'act') {
      this.armed = { intent: intent, x: x, y: y };
      this.paintOverlay();
      this.paintForecast();
      const confirm = this.app.querySelector('#confirm');
      confirm.hidden = false;
      confirm.textContent = 'Ударить';
    } else if (this.armed && this.armed.intent === intent && this.armed.x === x && this.armed.y === y) this.commit(intent, x, y);
    else {
      this.armed = { intent: intent, x: x, y: y };
      this.paintOverlay();
      this.paintForecast();
      const confirm = this.app.querySelector('#confirm');
      confirm.hidden = false;
      confirm.textContent = intent === 'move' ? 'Идти' : 'Ударить';
    }
  };

  Game.prototype.onHover = function (x, y) {
    if (this.busy) return;
    const occ = this.logic.unitAt(this.session.state, x, y);
    if (occ) this.showCard(occ.id);
    if (!this.selectedId) return;
    const intent = this.intentAt(x, y);
    if (!intent) {
      if (this.hover) { this.hover = null; this.paintOverlay(); this.paintForecast(); }
      return;
    }
    if (this.hover && this.hover.intent === intent && this.hover.x === x && this.hover.y === y) return;
    this.hover = { intent, x, y };
    this.paintOverlay();
    this.paintForecast();
  };

  Game.prototype.select = function (id) {
    const unit = this.logic.unitById(this.session.state, id);
    if (!unit || unit.side !== 'player' || unit.hp <= 0) return;
    if (id === this.selectedId) return;
    const step = this.tutStep();
    if (step) {
      if (!this.tutorial.allows(step, { type: 'select', unitId: id })) return this.deny();
      this.tutorial.advance(this.tut, { type: 'select', unitId: id });
    }
    this.selectedId = id;
    this.mode = unit.moved && !unit.acted ? 'weapon' : 'move';
    this.armed = null;
    this.hover = null;
    const confirm = this.app.querySelector('#confirm');
    if (confirm) confirm.hidden = true;
    this.draw();
  };

  Game.prototype.commit = function (intent, x, y) {
    const cmd = intent === 'move'
      ? { type: 'move', unitId: this.selectedId, x, y }
      : { type: 'act', unitId: this.selectedId, x, y };
    return this.run(cmd, () => {
      if (intent === 'move') this.mode = 'weapon';
      if (intent === 'act') {
        const unit = this.logic.unitById(this.session.state, this.selectedId);
        if (!unit || unit.acted) this.selectedId = null;
      }
    });
  };

  Game.prototype.run = async function (cmd, after) {
    if (this.busy) return;
    const result = this.logic.dispatch(this.session, cmd);
    if (!result.ok) return;
    this.busy = true;
    this.armed = null;
    this.hover = null;
    const confirm = this.app.querySelector('#confirm');
    if (confirm) confirm.hidden = true;
    this.lastLines = narrate(result.events || []);
    this.paintChrome();
    try {
      await this.play(result.events || []);
    } finally {
      this.busy = false;
    }
    if (after) after();
    this.noteCommand(cmd);
    this.persist();
    this.draw();
    this.showLast();
  };

  Game.prototype.showLast = function () {
    const box = this.app.querySelector('.last');
    if (!box) return;
    if (!this.lastLines.length) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = '<b>Сделано.</b>' + list(this.lastLines);
  };

  Game.prototype.doUndo = function () {
    if (this.busy) return;
    if (this.tutStep()) return this.deny();
    const result = this.logic.dispatch(this.session, { type: 'undo' });
    if (!result.ok) return;
    this.blip('move');
    this.armed = null;
    this.lastLines = ['Шаг отменён'];
    const sel = this.selected();
    if (sel && sel.acted) this.selectedId = null;
    this.persist();
    this.draw();
    this.showLast();
  };

  Game.prototype.doReset = function () {
    if (this.busy) return;
    if (this.tutStep()) return this.deny();
    const result = this.logic.dispatch(this.session, { type: 'reset' });
    if (!result.ok) return;
    this.selectedId = null;
    this.mode = 'move';
    this.armed = null;
    this.lastLines = ['Ход сброшен'];
    this.persist();
    this.draw();
    this.showLast();
  };

  Game.prototype.doWait = function () {
    if (this.tutStep()) return this.deny();
    if (!this.selectedId) return;
    this.run({ type: 'wait', unitId: this.selectedId }, () => { this.selectedId = null; });
  };

  Game.prototype.doEnd = function () {
    if (this.busy || this.session.state.status !== 'playing') return;
    const step = this.tutStep();
    if (step && !this.tutorial.allows(step, { type: 'end' })) return this.deny();
    this.selectedId = null;
    this.run({ type: 'end' });
  };

  Game.prototype.play = async function (events) {
    if (this.reduced || !events.length) return;
    const groups = group(events);
    for (const bag of groups) {
      const head = bag[0];
      if (head.t === 'marker') await this.banner(head.id);
      else if (head.t === 'move') await this.animMove(head);
      else if (head.t === 'shot') await this.animShot(head);
      else if (head.t === 'push') await this.animPush(head);
      else await this.animImpact(bag);
    }
  };

  Game.prototype.banner = function (id) {
    const text = {
      resolve: 'Враги бьют',
      spawn: 'Новые враги',
      plan: 'Враги занимают клетки',
      win: 'Здания целы',
      player: 'Ваш ход',
    }[id];
    if (!text) return Promise.resolve();
    const el = document.createElement('div');
    el.className = 'banner';
    el.textContent = text;
    this.board.appendChild(el);
    return this.wait(id === 'resolve' ? 420 : 280).then(() => el.remove());
  };

  Game.prototype.animMove = function (e) {
    const el = this.piece(e.id);
    if (!el) return Promise.resolve();
    this.blip('move');
    return this.tweenPath(el, e.path, 110);
  };

  Game.prototype.animPush = function (e) {
    const el = this.piece(e.id);
    if (!el) return Promise.resolve();
    this.blip('hit');
    return this.tweenPath(el, [e.from, e.to], 160);
  };

  Game.prototype.animate = function (total, onFrame) {
    if (this.reduced || !(total > 0)) {
      onFrame(1);
      return Promise.resolve();
    }
    const start = performance.now();
    return new Promise((resolve) => {
      const tick = () => {
        const u = Math.min(1, (performance.now() - start) / total);
        onFrame(u);
        if (u < 1) setTimeout(tick, 16);
        else resolve();
      };
      setTimeout(tick, 16);
    });
  };

  Game.prototype.tweenPath = function (el, path, ms) {
    if (!path || path.length < 2) return Promise.resolve();
    const step = this.tile + this.gap;
    const total = (path.length - 1) * ms / this.pace;
    return this.animate(total, (u) => {
      const f = u * (path.length - 1);
      const i = Math.min(path.length - 2, Math.floor(f));
      const local = f - i;
      const eased = local * local * (3 - 2 * local);
      const a = path[i];
      const b = path[i + 1];
      const x = a.x + (b.x - a.x) * eased;
      const y = a.y + (b.y - a.y) * eased;
      el.style.transform = 'translate(' + (x * step) + 'px,' + (y * step) + 'px)';
    });
  };

  Game.prototype.animShot = function (e) {
    this.blip(e.kind === 'shell' ? 'shot' : 'hit');
    if (e.kind === 'shell') return this.animShell(e);
    if (e.kind === 'hook') return this.animHook(e);
    if (e.kind === 'lance') return this.animLance(e);
    return this.animLunge(e);
  };

  Game.prototype.animShell = function (e) {
    const shell = document.createElement('div');
    shell.className = 'shell';
    this.board.appendChild(shell);
    const step = this.tile + this.gap;
    const mid = this.tile / 2;
    const a = { x: e.from.x * step + mid, y: e.from.y * step + mid };
    const b = { x: e.to.x * step + mid, y: e.to.y * step + mid };
    const lift = 70 + Math.hypot(b.x - a.x, b.y - a.y) * 0.25;
    const total = 320 / this.pace;
    return this.animate(total, (t) => {
      const x = (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * ((a.x + b.x) / 2) + t * t * b.x;
      const y = (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * ((a.y + b.y) / 2 - lift) + t * t * b.y;
      shell.style.left = x + 'px';
      shell.style.top = y + 'px';
    }).then(() => {
      shell.remove();
      this.flash(e.to.x, e.to.y);
    });
  };

  Game.prototype.animHook = function (e) {
    const step = this.tile + this.gap;
    const mid = this.tile / 2;
    const a = { x: e.from.x * step + mid, y: e.from.y * step + mid };
    const b = { x: e.to.x * step + mid, y: e.to.y * step + mid };
    const svgNs = 'http:' + '//www.w3.org/2000/svg';
    const line = document.createElementNS(svgNs, 'line');
    line.setAttribute('x1', a.x);
    line.setAttribute('y1', a.y);
    line.setAttribute('x2', a.x);
    line.setAttribute('y2', a.y);
    line.setAttribute('stroke', '#ffd7a4');
    line.setAttribute('stroke-width', '3');
    this.fx.appendChild(line);
    const total = 220 / this.pace;
    return this.animate(total, (t) => {
      line.setAttribute('x2', a.x + (b.x - a.x) * t);
      line.setAttribute('y2', a.y + (b.y - a.y) * t);
    }).then(() => line.remove());
  };

  Game.prototype.animLance = function (e) {
    const tiles = e.tiles && e.tiles.length ? e.tiles : [e.to];
    tiles.forEach((cell, i) => {
      const el = this.tileNodes[cell.y * 8 + cell.x];
      if (el) setTimeout(() => el.classList.add('hitflash'), i * 40);
    });
    return this.wait(180 + tiles.length * 40);
  };

  Game.prototype.animLunge = function (e) {
    const el = e.by ? this.piece(e.by) : null;
    if (!el) return this.wait(80);
    const rot = el.querySelector('.rot');
    const back = rot.style.transform;
    const kick = e.dir === 'N' ? 'translateY(-6px)' : e.dir === 'S' ? 'translateY(6px)' : e.dir === 'E' ? 'translateX(6px)' : 'translateX(-6px)';
    rot.style.transform = back + ' ' + kick;
    return this.wait(90).then(() => { rot.style.transform = back; return this.wait(40); });
  };

  Game.prototype.animImpact = function (bag) {
    this.paintTiles();
    this.paintChrome();
    let power = 0;
    for (const e of bag) {
      if (e.t === 'spawn') this.spawnPiece(e);
      if (e.t === 'shake') power = Math.max(power, e.power || 1);
      if (e.t === 'damage') this.float(e.x, e.y, '−' + e.amount);
      if (e.t === 'death') {
        this.blip('die');
        const el = this.piece(e.id);
        if (el) {
          el.style.transition = 'transform 180ms ease, opacity 180ms ease';
          el.style.opacity = '0';
          if (e.cause === 'water') el.style.filter = 'saturate(0.2) brightness(0.6)';
        }
      }
      if (e.t === 'terrain') {
        const tile = this.tileNodes[e.y * 8 + e.x];
        if (tile) tile.classList.add('hitflash');
      }
      if (e.t === 'spawn') this.blip('shot');
      if ((e.t === 'damage' && e.target === 'tile') || e.t === 'bump') {
        const tile = this.tileNodes[e.y * 8 + e.x];
        if (tile) tile.classList.add('hitflash');
      }
    }
    if (power && !this.reduced) {
      this.board.style.setProperty('--shake', (2 + power * 2) + 'px');
      this.board.classList.remove('shake');
      void this.board.offsetWidth;
      this.board.classList.add('shake');
    }
    if (bag.some((e) => e.t === 'damage' && e.target === 'tile' && e.terrain === 'building')) this.blip('hit');
    return this.wait(220);
  };

  Game.prototype.float = function (x, y, text) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = text;
    const step = this.tile + this.gap;
    el.style.left = (x * step + this.tile / 2) + 'px';
    el.style.top = (y * step + this.tile * 0.35) + 'px';
    this.board.appendChild(el);
    setTimeout(() => el.remove(), 700);
  };

  Game.prototype.flash = function (x, y) {
    const el = document.createElement('div');
    el.className = 'impact';
    const step = this.tile + this.gap;
    el.style.left = (x * step + this.tile / 2) + 'px';
    el.style.top = (y * step + this.tile / 2) + 'px';
    this.board.appendChild(el);
    setTimeout(() => el.remove(), 300);
  };

  Game.prototype.piece = function (id) {
    return this.piecesEl.querySelector('[data-id="' + id + '"]');
  };

  Game.prototype.wait = function (ms) {
    return new Promise((resolve) => setTimeout(resolve, this.reduced ? 0 : ms / this.pace));
  };

  Game.prototype.onKey = function (e) {
    if (this.helpOpen) {
      if (e.code === 'Escape') this.closeHelp();
      return;
    }
    if (this.screen !== 'battle' || !this.session || this.busy) return;
    const code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) e.preventDefault();
    if (code === 'Digit1') this.selectNth(0);
    else if (code === 'Digit2') this.selectNth(1);
    else if (code === 'Digit3') this.selectNth(2);
    else if (code === 'ArrowUp') this.nudge(0, -1);
    else if (code === 'ArrowDown') this.nudge(0, 1);
    else if (code === 'ArrowLeft') this.nudge(-1, 0);
    else if (code === 'ArrowRight') this.nudge(1, 0);
    else if (code === 'Enter' || code === 'Space') this.onTile(this.cursor.x, this.cursor.y);
    else if (code === 'Escape') { this.selectedId = null; this.armed = null; this.draw(); }
    else if (code === 'Backspace' || code === 'KeyU') this.doUndo();
    else if (code === 'KeyR') this.doReset();
    else if (code === 'KeyE') this.doEnd();
    else if (code === 'KeyM') { this.mode = 'move'; this.paintModes(); this.paintOverlay(); }
    else if (code === 'KeyF') { this.mode = 'weapon'; this.paintModes(); this.paintOverlay(); }
    else if (code === 'KeyH') this.openHelp();
  };

  Game.prototype.selectNth = function (index) {
    const order = ['klin', 'duga', 'kryuk'];
    const id = order[index];
    if (this.logic.unitById(this.session.state, id)) this.select(id);
  };

  Game.prototype.nudge = function (dx, dy) {
    this.cursorOn = true;
    this.cursor = {
      x: Math.max(0, Math.min(7, this.cursor.x + dx)),
      y: Math.max(0, Math.min(7, this.cursor.y + dy)),
    };
    this.hover = null;
    const intent = this.intentAt(this.cursor.x, this.cursor.y);
    if (intent && this.fine) this.hover = { intent, x: this.cursor.x, y: this.cursor.y };
    this.paintOverlay();
    this.paintForecast();
  };

  Game.prototype.openHelp = function () {
    this.helpOpen = true;
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = '<div class="sheet" role="dialog" aria-labelledby="help-title"><h2 id="help-title">Правила</h2>' + helpHtml() +
      '<p><button class="primary" type="button" id="close-help">Закрыть</button></p></div>';
    document.body.appendChild(modal);
    modal.querySelector('#close-help').onclick = () => this.closeHelp();
    modal.addEventListener('click', (e) => { if (e.target === modal) this.closeHelp(); });
    this.helpEl = modal;
  };

  Game.prototype.closeHelp = function () {
    this.helpOpen = false;
    if (this.helpEl) this.helpEl.remove();
    this.helpEl = null;
  };

  Game.prototype.spawnPiece = function (e) {
    if (this.piece(e.id)) return;
    const el = document.createElement('div');
    el.dataset.id = e.id;
    el.className = 'piece enemy';
    el.innerHTML = '<div class="rot">' + svgUnit(e.kind) + '</div><span class="tag">' + (TAG[e.kind] || '') + '</span><span class="badge" hidden></span><span class="hp"></span>';
    const step = this.tile + this.gap;
    el.style.transform = 'translate(' + (e.x * step) + 'px,' + (e.y * step) + 'px)';
    this.piecesEl.appendChild(el);
  };

  Game.prototype.playCommands = async function (cmds, pace) {
    this.pace = pace || 1;
    for (const cmd of cmds) {
      if (!this.session || this.session.state.status !== 'playing') break;
      const result = this.logic.dispatch(this.session, cmd);
      if (!result.ok) break;
      this.busy = true;
      this.lastLines = narrate(result.events || []);
      await this.play(result.events || []);
      this.busy = false;
      this.draw();
    }
    this.pace = 1;
    this.persist();
    this.draw();
  };

  function group(events) {
    const groups = [];
    let bag = [];
    const flush = () => { if (bag.length) groups.push(bag); bag = []; };
    for (const e of events) {
      if (e.t === 'move' || e.t === 'shot' || e.t === 'push' || e.t === 'marker') {
        flush();
        groups.push([e]);
      } else bag.push(e);
    }
    flush();
    return groups;
  }

  function list(lines) {
    if (!lines.length) return '';
    return '<ul>' + lines.map((line) => '<li>' + line + '</li>').join('') + '</ul>';
  }

  function row(k, v) {
    return '<div class="score-row"><span>' + k + '</span><span>' + v + '</span></div>';
  }

  function labelTile(tile) {
    const kind = tile.terrain === 'water' ? 'яма' : tile.terrain === 'mountain' ? 'гора' : tile.terrain === 'building' ? (tile.objective ? 'большое здание' : 'здание') : 'земля';
    return 'Ряд ' + (tile.y + 1) + ', столбец ' + (tile.x + 1) + ', ' + kind;
  }

  function decoOf(tile) {
    if (tile.terrain === 'mountain') {
      return '<svg viewBox="0 0 64 64" width="100%" height="100%"><polygon points="6,56 32,8 58,56" fill="#8ea0b4"/><polygon points="32,8 42,30 26,28" fill="#d5dee8" opacity=".8"/></svg>';
    }
    if (tile.terrain === 'building') {
      const antenna = tile.objective ? '<rect x="30" y="4" width="4" height="10" fill="#ffe08a"/><circle cx="32" cy="4" r="3" fill="#fff4c8"/>' : '';
      return '<svg viewBox="0 0 64 64" width="100%" height="100%">' + antenna +
        '<polygon points="10,30 32,14 54,30" fill="#f0c27a"/><rect x="14" y="30" width="36" height="22" rx="2" fill="#c9843a"/>' +
        '<rect x="18" y="36" width="6" height="6" fill="#ffe08a"/><rect x="40" y="36" width="6" height="6" fill="#ffe08a"/>' +
        '<rect x="28" y="38" width="8" height="14" fill="#3a2414"/></svg>';
    }
    if (tile.rubble === 'building') {
      return '<svg viewBox="0 0 64 64" width="100%" height="100%"><rect x="12" y="36" width="18" height="10" fill="#6a5344"/><rect x="32" y="40" width="16" height="8" fill="#4e3b32"/><path d="M16 30 L30 44" stroke="#2a211c" stroke-width="2"/></svg>';
    }
    if (tile.spawn) {
      return '<svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="32" r="12" fill="none" stroke="#b450e0" stroke-width="2" stroke-dasharray="3 3"/><circle cx="32" cy="32" r="3" fill="#d9a0ff"/></svg>';
    }
    return '';
  }

  function mini(battle) {
    let html = '<div class="mini" aria-hidden="true">';
    const chars = battle.map.join('');
    for (const ch of chars) {
      const cls = { '.': 'g', '~': 'w', '#': 'n', B: 'b', R: 'r', S: 's' }[ch] || 'g';
      html += '<i class="m-' + cls + '"></i>';
    }
    html += '</div>';
    return html;
  }

  function heroArt() {
    return '<svg viewBox="0 0 640 420">' +
      '<rect width="640" height="420" fill="#141924"/>' +
      '<path d="M40 300 H600 V360 H40 Z" fill="#1c2433"/>' +
      '<path d="M70 250 H250 V300 H70 Z" fill="#243044"/>' +
      '<path d="M250 220 H430 V300 H250 Z" fill="#2a3346"/>' +
      '<path d="M430 260 H580 V300 H430 Z" fill="#243044"/>' +
      '<path d="M300 80 C340 140 300 180 320 230" fill="none" stroke="#14545c" stroke-width="28"/>' +
      '<path d="M300 80 C340 140 300 180 320 230" fill="none" stroke="#7ed0c4" stroke-width="4"/>' +
      '<polygon points="120,250 150,190 180,250" fill="#8ea0b4"/>' +
      '<rect x="200" y="200" width="46" height="50" fill="#c9843a"/><polygon points="190,200 223,168 256,200" fill="#f0c27a"/>' +
      '<circle cx="223" cy="168" r="4" fill="#ffe08a"/>' +
      '<g transform="translate(360,168)">' + svgUnit('klin').replace('<svg', '<svg width="70" height="70"') + '</g>' +
      '<g transform="translate(430,190)">' + svgUnit('duga').replace('<svg', '<svg width="64" height="64"') + '</g>' +
      '<g transform="translate(500,176)">' + svgUnit('kryuk').replace('<svg', '<svg width="64" height="64"') + '</g>' +
      '<g transform="translate(250,150)">' + svgUnit('scara').replace('<svg', '<svg width="58" height="58"') + '</g>' +
      '</svg>';
  }

  function attackIcon(icon) {
    if (icon === 'push') return '<svg viewBox="0 0 16 16"><path d="M2 8 H10 M7 4 L12 8 L7 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    if (icon === 'arc') return '<svg viewBox="0 0 16 16"><path d="M2 12 Q8 2 14 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    if (icon === 'hook') return '<svg viewBox="0 0 16 16"><path d="M4 13 V5 H10 Q13 5 13 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    if (icon === 'jab') return '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/></svg>';
    if (icon === 'lance') return '<svg viewBox="0 0 16 16"><path d="M8 14 V3 M5 6 L8 2 L11 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    return '<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor"/></svg>';
  }

  function diagramHtml(kind) {
    const diagram = globalThis.KromkaUnits.profile(kind).diagram;
    let html = '<div class="minigrid" style="--n:' + diagram.size + '">';
    for (let y = 0; y < diagram.size; y++) {
      for (let x = 0; x < diagram.size; x++) {
        const cell = diagram.cells.find((item) => item.x === x && item.y === y);
        const mark = cell ? cell.kind : 'empty';
        const arrow = cell && cell.arrow ? ' data-arrow="' + cell.arrow + '"' : '';
        const amount = cell && cell.amount ? '<b>' + cell.amount + '</b>' : '';
        html += '<i class="' + mark + '"' + arrow + '>' + amount + '</i>';
      }
    }
    return html + '</div><p class="diagram-note">' + diagram.note + '</p>';
  }

  function compareRow(side) {
    const book = globalThis.KromkaUnits.PROFILES;
    const kinds = Object.keys(book).filter((kind) => book[kind].side === side);
    return '<div class="compare">' + kinds.map((kind) => {
      const card = book[kind];
      return '<article class="compare-card" style="--accent:' + card.accent + '">' +
        '<div class="compare-top">' + svgUnit(kind).replace('<svg', '<svg width="48" height="48"') +
        '<span class="atk-icon">' + attackIcon(card.icon) + '</span></div>' +
        '<b>' + card.name + '</b><div>' + card.role + '</div>' +
        '<div class="sub">жизни ' + card.hp + ' · ход ' + card.move + '</div>' +
        diagramHtml(kind) + '</article>';
    }).join('') + '</div>';
  }

  function helpHtml() {
    return [
      '<p>Пять ходов. Жёлтая шкала — энергия зданий. Ноль — проигрыш. Нет мехов — тоже проигрыш.</p>',
      '<p><i class="swatch red"></i>удар врага <i class="swatch blue"></i>ход <i class="swatch gold"></i>урон <i class="swatch push"></i>толчок <i class="swatch pull"></i>тяга</p>',
      '<h3>Мехи рядом</h3>',
      compareRow('player'),
      '<h3>Враги рядом</h3>',
      compareRow('enemy'),
      '<p>Толкнули врага — его красная клетка переехала. Яма уничтожает. Упор в фигуру, гору или здание даёт по 1 урона обоим. Враги бьют в начале своего хода по цифрам: игла, жук, молот.</p>',
      '<p>За ход мех может пойти, потом ударить. «Конец хода» отдаёт ход врагам. Наведите или нажмите фигуру — откроется её карточка.</p>',
    ].join('');
  }

  function mount(app) {
    if (!app) return null;
    const game = new Game(app);
    globalThis.__kromka = game;
    if (!game.store.tutorialDone) game.startBattle('obryv');
    else game.showTitle();
    return game;
  }

  return { mount, narrate, Game };
});

</script>
</body>
</html>
